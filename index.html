<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ujung Jari</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f7d8c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192024" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ujung Jari">
<meta name="description" content="Ujung Jari: belajar huruf, angka, bentuk, warna, dan pola, pelan-pelan dengan jari.">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef0; --surface:#fbfcfc; --surface-2:#f2f6f7;
  --ink:#26343a; --muted:#67787f; --line:#d7e0e3;
  --accent:#4f7d8c; --accent-soft:#d8e5e9;
  --ok:#6b9b76; --ok-soft:#dbe9dd; --star:#c99a4e;
  --radius:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#192024; --surface:#232d31; --surface-2:#1f282c;
    --ink:#e3eaec; --muted:#9bacb2; --line:#334045;
    --accent:#8cb5c1; --accent-soft:#2b3a40;
    --ok:#8ab694; --ok-soft:#2c3a31; --star:#d9b573;
  }
}
:root[data-theme="dark"]{
  --bg:#192024; --surface:#232d31; --surface-2:#1f282c;
  --ink:#e3eaec; --muted:#9bacb2; --line:#334045;
  --accent:#8cb5c1; --accent-soft:#2b3a40;
  --ok:#8ab694; --ok-soft:#2c3a31; --star:#d9b573;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--ink);
  font-family:Andika,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.5;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column; overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

#splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:4px;
  opacity:0;animation:spMuncul .3s ease .15s forwards}
@keyframes spMuncul{to{opacity:1}}
#splash.pergi{animation:none;opacity:0;transition:opacity .25s ease;pointer-events:none}
.sp-judul{font-size:19px;font-weight:700;margin:18px 0 0;color:var(--ink)}
.sp-kecil{font-size:14px;color:var(--muted);margin:2px 0 0}
/* jejak titik yang menanjak, sama seperti ikon aplikasi */
.sp-ikon{position:relative;width:132px;height:74px}
.sp-ikon i,.sp-ikon b{position:absolute;border-radius:50%;background:var(--accent);display:block}
.sp-ikon i{width:9px;height:9px;opacity:.3}
.sp-ikon i:nth-child(1){left:2px;  top:58px}
.sp-ikon i:nth-child(2){left:20px; top:47px}
.sp-ikon i:nth-child(3){left:38px; top:37px}
.sp-ikon i:nth-child(4){left:56px; top:28px}
.sp-ikon i:nth-child(5){left:74px; top:20px}
.sp-ikon i:nth-child(6){left:92px; top:13px}
.sp-ikon b{width:26px;height:26px;left:104px;top:0}
@media (prefers-reduced-motion:no-preference){
  .sp-ikon i{animation:spTitik 1.6s ease-in-out infinite}
  .sp-ikon i:nth-child(2){animation-delay:.12s}
  .sp-ikon i:nth-child(3){animation-delay:.24s}
  .sp-ikon i:nth-child(4){animation-delay:.36s}
  .sp-ikon i:nth-child(5){animation-delay:.48s}
  .sp-ikon i:nth-child(6){animation-delay:.60s}
  @keyframes spTitik{0%,70%,100%{opacity:.3}35%{opacity:.85}}
}

header{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:60px;
  background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:19px;margin:0;font-weight:700;flex:1;text-align:center}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--surface-2);
  display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.icon-btn[hidden]{display:none}
main{flex:1 1 auto;overflow-y:auto;padding:16px 16px 22px;display:flex;flex-direction:column}

/* Tiap materi punya warna sendiri. Warnanya dipilih yang mid-tone supaya
   terbaca baik di tema terang maupun gelap, dan tetap rendah stimulus. */
body[data-topic="upper"]{--accent:#5f94a3}
body[data-topic="lower"]{--accent:#6a9c77}
body[data-topic="num"]{--accent:#8d80b3}
body[data-topic="hijaiyah"]{--accent:#5b9b8f}
body[data-topic="profesi"]{--accent:#b07a52}
body[data-topic="buah"]{--accent:#c06a5a}
body[data-topic="kendaraan"]{--accent:#4a84a8}
body[data-topic="aktivitas"]{--accent:#7b8f5e}
body[data-topic="benda"]{--accent:#a8794a}
body[data-topic="shape"]{--accent:#c08a57}
body[data-topic="color"]{--accent:#bd7d8e}
body[data-topic="pattern"]{--accent:#5b8bb8}
body[data-topic="kalimat"]{--accent:#6b86a5}
@supports (color: color-mix(in srgb, red 50%, blue)){
  body[data-topic]{--accent-soft:color-mix(in srgb, var(--accent) 20%, var(--surface))}
}

.hero{text-align:center;padding:0 0 14px}
.hero p{margin:0 0 10px;color:var(--muted);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
.chip b{color:var(--star)}

.menu{display:flex;flex-direction:column;gap:10px}
.grup{font-size:14px;font-weight:700;color:var(--muted);margin:18px 0 8px 6px;
  letter-spacing:.04em;text-transform:uppercase}
.grup:first-of-type{margin-top:4px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:24px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.tile .bubble{width:62px;height:62px;flex:0 0 auto;border-radius:20px;display:grid;place-items:center;
  font-size:28px;font-weight:700;color:var(--tint);background:var(--tint-soft)}
.tile .bubble svg{width:34px;height:34px;color:var(--tint)}
.bubble-ar{font-family:"Noto Naskh Arabic","Noto Sans Arabic",serif;font-size:34px;line-height:1}
.tile .tx{flex:1;min-width:0}
.tile .tx b{display:block;font-size:19px}
.tile .tx i{display:block;font-style:normal;color:var(--muted);font-size:14px;margin-top:1px}
.bar{display:block;height:7px;border-radius:999px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--tint);border-radius:999px}
.tile.pasang{border-color:var(--accent);border-width:2px}
button.mailbtn{border:none;cursor:pointer}

/* Tampilan beranda bisa dipilih lewat Pengaturan. Daftar tetap bawaan:
   satu kartu per baris paling mudah dipindai anak. Petak dua kolom membuat
   12 materi muat tanpa gulir panjang, berguna untuk orang tua dan terapis.
   Subjudul panjang diganti yang pendek supaya kartu tidak jadi tiga baris. */
.tile .tx i.sub-pendek{display:none}
.menu.petak{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu.petak .tile{flex-direction:column;align-items:center;text-align:center;
  gap:8px;padding:14px 10px;height:100%}
.menu.petak .tile .bubble{width:58px;height:58px}
.menu.petak .tile .tx{flex:0 0 auto;width:100%}
.menu.petak .tile .tx b{font-size:16px;line-height:1.25}
.menu.petak .tile .tx i.sub-panjang{display:none}
.menu.petak .tile .tx i.sub-pendek{display:block}

/* Halaman Pencapaian. Dibaca orang tua dan terapis, bukan anak, jadi
   tampilannya setenang halaman Pengaturan: tanpa warna juara, tanpa
   angka raksasa, tanpa ucapan selamat. */
.capai{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:14px 16px;margin-bottom:10px}
.capai h4{margin:0;font-size:17px}
.capai .baris{display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;font-size:15px;color:var(--muted);margin-top:6px}
.capai .baris b{color:var(--ink);white-space:nowrap}
.capai .kosong{font-size:14px;color:var(--muted);margin-top:6px}
.capai .bar{margin-top:8px}
.ringkas{white-space:pre-wrap;font-size:14px;line-height:1.5;margin:0 0 12px;
  font-family:inherit}

.tabs{display:flex;gap:5px;background:var(--surface-2);padding:5px;border-radius:16px;
  margin-bottom:12px;flex:0 0 auto}
.tab{flex:1;padding:11px 2px;border-radius:12px;text-align:center;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}

.stage{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0;padding-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.gl{font-size:clamp(100px,36vw,170px);line-height:1.05;font-weight:700}
.gl.ar{font-family:"Noto Naskh Arabic","Noto Sans Arabic",serif;line-height:1.45;
  font-size:clamp(96px,34vw,160px)}
.prompt .gl.ar{font-size:60px}
.choice .gl.ar{font-size:42px}
.card .sh{width:min(56vw,230px);height:min(56vw,230px);color:var(--accent)}
.card .sw{width:min(50vw,200px);height:min(50vw,200px)}
.word{font-size:21px;color:var(--muted)}
.word .emoji{font-size:30px;vertical-align:-4px;margin-right:6px}
.counter{text-align:center;color:var(--muted);font-size:15px;flex:0 0 auto}
.sh{display:block}
.sw{display:inline-block;border-radius:14px;border:2px solid var(--line)}
.sw.round{border-radius:50%}
.foto{display:block;width:min(54vw,215px);height:auto;border-radius:14px}
.prompt .foto{width:84px;border-radius:9px}
.choice .foto{width:62px;border-radius:9px}
.tile .bubble .foto{width:42px;height:auto;border-radius:8px}

.controls{display:flex;gap:10px;align-items:stretch;flex:0 0 auto}
.ctrl{background:var(--surface);border:1px solid var(--line);border-radius:20px;min-height:68px;
  display:grid;place-items:center;font-size:26px;flex:1}
.ctrl.say{background:var(--accent-soft);border-color:transparent;flex:1.4;font-size:17px;
  font-weight:700;color:var(--ink);gap:8px;grid-auto-flow:column}
.ctrl:disabled{opacity:.35}
.ctrl.locked{opacity:.35}

.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:min(100%,260px);margin-top:6px}
.dots i{aspect-ratio:1;border-radius:5px;background:var(--surface-2);display:block}
.dots i.on{background:var(--accent)}
.objs{display:grid;gap:4px 8px;justify-items:center;justify-content:center}
.objs span{font-size:30px;line-height:1.1}
.prompt .objs span{font-size:34px}
.choice .objs span{font-size:22px}


/* dibuat seperti tab di atasnya, dan flex:0 0 auto supaya tidak pernah tergencet */
.stagecap{font-size:13px;color:var(--muted);text-align:center;margin:0 0 6px;flex:0 0 auto}
.stageseg{display:flex;gap:6px;flex:0 0 auto;margin-bottom:6px;
  background:var(--surface-2);padding:6px;border-radius:18px}
.stageseg button{flex:1 1 0;min-width:0;min-height:62px;border-radius:14px;font-size:17px;
  color:var(--muted);display:grid;place-items:center;padding:0;white-space:nowrap;
  touch-action:manipulation}
.stageseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stagehint{font-size:14px;color:var(--muted);text-align:center;margin:0 0 10px;flex:0 0 auto}

.ask{text-align:center;font-size:19px;margin:0}
.ask b{font-size:25px}
/* Kotak contoh sengaja beda warna dan bergaris tegas, supaya anak tahu
   "yang ini yang dicari", bukan salah satu pilihan. */
.prompt{display:grid;place-items:center;background:var(--accent-soft);
  border:3px solid var(--accent);border-radius:24px;padding:12px;min-height:104px}
.prompt .gl{font-size:64px}
.prompt .sh{width:88px;height:88px;color:var(--accent)}
.prompt .sw{width:84px;height:84px}
.choices{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:24px;min-height:92px;
  display:grid;place-items:center;padding:8px}
.choice .gl{font-size:44px}
.choice .sh{width:62px;height:62px;color:var(--accent)}
.choice .sw{width:58px;height:58px}
/* Menyusun kalimat: dua kartu berdampingan, dan kotak kosong yang menunggu
   diisi. Lebar kartu dipatok ke lebar layar supaya dua kartu plus jaraknya
   tetap muat di ponsel sempit. */
.kstrip{display:flex;gap:8px;justify-content:center;align-items:center;margin:2px 0}
.kkartu{width:min(22vw,88px);height:auto;border-radius:10px;display:block}
.kslot{width:min(22vw,88px);aspect-ratio:3/4;border:2px dashed var(--line);
  border-radius:10px;display:grid;place-items:center;background:var(--surface-2)}
.kslot i{font-style:normal;font-size:12px;color:var(--muted)}
.kslot.aktif{border-color:var(--accent);background:var(--accent-soft)}
.kslot.isi{border:0;background:none;width:auto;aspect-ratio:auto;display:block}
.kprompt{display:grid;place-items:center}
.kprompt img{width:min(24vw,94px);aspect-ratio:1/1;object-fit:cover;
  object-position:top;border-radius:12px;background:var(--surface-2)}
/* Layar Latihan materi ini paling padat isinya: petunjuk, dua kotak, dan
   sampai enam kartu pilihan. Semuanya dirapatkan supaya anak tidak perlu
   menggulir untuk melihat pilihannya. Belajar tetap memakai kartu besar. */
.belajar-kstrip .kkartu{width:min(36vw,146px)}
.stage.kal{gap:7px}
.stage.kal .ask{font-size:17px;margin:0}
.choices.kartu3{grid-template-columns:repeat(3,1fr);gap:8px}
.choices.kartu4{grid-template-columns:repeat(4,1fr);gap:7px}
body[data-topic="kalimat"] .stagecap{display:none}
body[data-topic="kalimat"] .stageseg{margin-bottom:2px}
body[data-topic="kalimat"] .stageseg button{min-height:48px;font-size:15px}
body[data-topic="kalimat"] .stagehint{font-size:12px;margin:2px 0 4px}
.choice.kartu{padding:5px;min-height:0;border-radius:14px}
.choice.kartu .kkartu{width:100%;max-width:none}
.choice.right{background:var(--ok-soft);border-color:var(--ok)}
.choice.again{opacity:.3}
.choice.hint{border-color:var(--accent);background:var(--accent-soft)}
.seq{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.seq .cell{width:52px;height:52px;display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:14px}
.seq .cell svg{width:38px;height:38px}
.seq .cell.ask-cell{border-style:dashed;font-size:26px;color:var(--muted)}
.progress{display:flex;gap:8px;justify-content:center;padding-top:2px}
.progress span{width:14px;height:14px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.progress span.done{background:var(--star);border-color:transparent}
.done-note{text-align:center;font-size:18px;color:var(--muted);min-height:26px;margin:0}
.done-note.ok{color:var(--ok);font-weight:700}

.canvas-wrap{flex:1 1 auto;background:var(--surface);border:1px solid var(--line);border-radius:28px;
  overflow:hidden;min-height:300px;position:relative;
  width:calc(100% + 20px);margin-left:-10px;margin-right:-10px}
canvas{display:block;width:100%;height:100%;touch-action:none}
.demo-btn{position:absolute;top:12px;left:14px;min-height:0;padding:8px 14px;border-radius:999px;
  background:var(--accent-soft);color:var(--ink);font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:6px;border:1px solid transparent}
.demo-btn.main{background:var(--accent);color:#fff}
.stamp{position:absolute;top:12px;right:14px;width:46px;height:46px;border-radius:50%;
  background:var(--ok);color:#fff;display:grid;place-items:center;font-size:26px;opacity:0;pointer-events:none}
.stamp.show{opacity:1}
.gauge{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:12px;flex:0 0 auto}
.gauge i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px}
.gauge i.ok{background:var(--ok)}
.status{text-align:center;font-size:17px;color:var(--muted);margin:10px 0 0;min-height:26px;flex:0 0 auto}
.status.ok{color:var(--ok);font-weight:700}

.setting{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.setting .lbl{font-weight:700}
.setting .hint{color:var(--muted);font-size:14px;margin-top:2px}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;padding:12px 4px;border-radius:12px;background:var(--surface-2);font-size:15px;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:700}
.seg.small button{font-size:14px}
.materi{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.materi button{padding:10px 12px;border-radius:12px;background:var(--surface-2);
  font-size:14px;min-height:44px;opacity:.45}
.materi button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:700;opacity:1}
.note{color:var(--muted);font-size:14px;text-align:center;padding:10px 4px 0}
.ov{position:fixed;inset:0;background:rgba(10,16,18,.55);display:grid;place-items:center;
  padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:26px;
  width:100%;max-width:460px;max-height:100%;overflow-y:auto;padding:20px}
.dlg h3{margin:0 0 4px;font-size:20px}
.dlg p{margin:0 0 10px;font-size:16px;line-height:1.55}
.dlg ol{margin:0 0 12px;padding-left:22px}
.dlg li{margin-bottom:6px;font-size:16px;line-height:1.5}
.dlg .kecil{color:var(--muted);font-size:14px}
.kondisi{background:var(--surface-2);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:15px}
.kondisi b{display:block;margin-bottom:2px}
.kondisi .bad{color:var(--star)}
.kondisi .good{color:var(--ok)}
.dlgbtn{display:block;width:100%;min-height:56px;border-radius:16px;background:var(--surface-2);
  font-size:16px;margin-top:8px}
.dlgbtn.utama{background:var(--accent);color:#fff;font-weight:700}
.dlgbtn.sunyi{background:none;color:var(--muted);font-size:14px;min-height:44px}
.dlg.rew{text-align:center}
.rel{position:relative;overflow:hidden;height:150px;display:grid;place-items:center}
.rel:after{content:"";position:absolute;left:0;right:0;bottom:26px;height:4px;
  background:var(--line);border-radius:2px}
.loko{width:230px;height:106px;color:var(--accent);display:block}
.vid{display:block;width:100%;height:auto;border-radius:16px;background:#fff}
:root[data-theme="dark"] .vid{filter:brightness(.93)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vid{filter:brightness(.93)}}
.bintang{font-size:92px;line-height:1}
.rewtx{font-size:21px;font-weight:700;color:var(--ok);margin:4px 0 12px}
@media (prefers-reduced-motion:no-preference){
  .train{position:absolute;bottom:22px;left:0;animation:jalan 6.5s linear forwards}
  .bintang{animation:pop .4s ease}
  @keyframes jalan{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
}
.no-motion .train{position:static;animation:none!important}
.no-motion .bintang{animation:none!important}
.doc{max-width:560px}
.doc h3{font-size:18px;margin:20px 0 6px}
.doc h3:first-child{margin-top:4px}
.doc p{margin:0 0 10px;font-size:16px;line-height:1.6}

function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}

function idVoice(){
  var i,lg;
  for(i=0;i<voices.length;i++){
    lg=(voices[i].lang||"").toLowerCase().replace("_","-");
    /* sebagian Android melaporkan Indonesia sebagai in_ID, kode Java lama */
    if(lg==="id"||lg==="in"||lg.indexOf("id-")===0||lg.indexOf("in-id")===0||lg.indexOf("ind")===0) return voices[i];
  }
  for(i=0;i<voices.length;i++){
    var nm=((voices[i].name||"")+" "+(voices[i].voiceURI||"")).toLowerCase();
    if(nm.indexOf("indonesia")>=0||nm.indexOf("bahasa")>=0) return voices[i];
  }
  return null;
}

}

/* speak(teks, teksCadangan)
   teks         : ejaan Indonesia, dipakai kalau suara Indonesia tersedia
   teksCadangan : ejaan untuk mesin suara asing, dipakai hanya bila
                  pengguna memilih "Suara apa pun"                        */
function speak(text,alt,arText){
  if(!S.sound||!TTS||!text) return;
  if(!voices.length) loadVoices();
  /* Huruf hijaiyah: kalau ponsel punya suara Arab, pakai itu dan ucapkan
     nama huruf dalam bahasa Arab. Hasilnya jauh lebih benar daripada
     memaksa mesin Indonesia membaca "ghain" atau "qaf". */
  if(arText && S.hijVoice!=="id"){
    var va=arVoice();
    if(va){ utter(va,arText,va.lang); return; }
  }
  var v=idVoice();
  if(!v && S.voiceMode!=="any"){
    /* Tidak ada suara Indonesia. Lebih baik diam daripada mengajari anak
       nama huruf yang keliru, misalnya B terdengar "bi". */
    ttsNote="Suara Bahasa Indonesia belum terpasang, jadi suara dimatikan.";
    return;
  }
  utter(v, v?text:(alt||text), v?v.lang:"id-ID");
}
function utter(voice,say,lang){
  try{
    var busy=speechSynthesis.speaking||speechSynthesis.pending;
    if(busy) speechSynthesis.cancel();
    try{speechSynthesis.resume();}catch(e){}
    setTimeout(function(){
      try{
        var u=new SpeechSynthesisUtterance(say);
        if(voice) u.voice=voice;
        u.lang=lang||"id-ID";
        u.rate=.75;u.pitch=1;u.volume=1;
        u.onerror=function(ev){ttsNote="Gagal: "+((ev&&ev.error)||"tidak diketahui");};
        u.onstart=function(){ttsNote="";};
        speechSynthesis.speak(u);
      }catch(e){}
    }, busy?160:40);
  }catch(e){}
}

  if(t==="letter"){var u=String(x).toUpperCase();return [SAY[u],SAY_ALT[u]];}
  if(t==="hijaiyah"){var hh=hij(x);return [hh.say,hh.alt||hh.say,hh.ar];}
  if(t==="profesi"){var pp=prof(x);return [pp.say,pp.say];}
  if(t==="buah"||t==="kendaraan"||t==="aktivitas"||t==="benda"){var bb=String(x).toLowerCase();return [bb,bb];}
  if(t==="num") return [terbilang(x),terbilang(x)];
  if(t==="kalimat"){var kal=kalKalimat(x).toLowerCase();return [kal,kal];}
  return [String(x),String(x)];
}

  var M={en:"Inggris",id:"Indonesia",ms:"Melayu",ar:"Arab",ja:"Jepang",ko:"Korea",zh:"Mandarin",
         hi:"Hindi",es:"Spanyol",fr:"Prancis",de:"Jerman",pt:"Portugis",ru:"Rusia",th:"Thai",vi:"Vietnam"};
  return M[code]||code;

function voiceLangs(){
  var seen={},out=[],i,lg,base;
  for(i=0;i<voices.length;i++){
    lg=(voices[i].lang||"").replace("_","-");
    base=lg.split("-")[0].toLowerCase();
    if(base&&!seen[base]){seen[base]=1;out.push(base);}
  }

}
/* Mengucapkan beberapa penggal berurutan, boleh beda suara.
   Dipakai untuk hijaiyah: "mana huruf" dengan suara Indonesia,
   lalu nama hurufnya dengan suara Arab. */
function speakSeq(parts){
  if(!S.sound||!TTS||!parts.length) return;
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    try{speechSynthesis.resume();}catch(e){}
    setTimeout(function(){
      for(var i=0;i<parts.length;i++){
        try{
          var u=new SpeechSynthesisUtterance(parts[i].text);
          if(parts[i].voice) u.voice=parts[i].voice;
          u.lang=parts[i].lang||"id-ID";
          u.rate=.75;u.pitch=1;u.volume=1;
          speechSynthesis.speak(u);
        }catch(e){}
      }
    },120);
  }catch(e){}
}
function ttsStatus(){

}

/* ===================== LATIHAN TIGA TAHAP ===================== */
/* samakan  : contoh dan pilihan bentuknya sama persis
   pasangkan: contoh dalam bentuk lain (a untuk A, titik untuk angka)
   tunjuk   : hanya nama dan suara, tanpa contoh                        */

var STAGES=[
  ["samakan","Sama","Samakan","Contoh dan pilihan bentuknya sama persis"],
  ["pasangkan","Pasang","Pasangkan","Contoh tampil dalam bentuk lain"],
  ["tunjuk","Tunjuk","Tunjuk","Hanya nama dan suara, tanpa contoh"]
];
/* Materi Menyusun Kalimat punya tahapnya sendiri, bukan Sama/Pasang/Tunjuk.
   Lengkapi: kartu tokoh sudah terpasang, anak tinggal memilih kegiatannya.
   Susun: dua kotak kosong, pilihannya campur kartu tokoh dan kartu kegiatan,
   dan tokohnya harus dipilih lebih dulu, jadi urutan kata ikut dilatih. */
var KAL_STAGES=[
  ["lengkapi","Lengkapi","Lengkapi kalimatnya","Tokohnya sudah terpasang, pilih kegiatannya"],
  ["susun","Susun","Susun kalimatnya","Dua kotak kosong, pilih tokohnya dulu"]
];
function stagesFor(){
  var t=kind();
  if(t==="kalimat") return KAL_STAGES;
  if(t==="profesi"||t==="buah"||t==="kendaraan"||t==="aktivitas"||t==="benda") return [STAGES[0],STAGES[2]];
  /* Hijaiyah ikut dua tahap saja (4.9). Pasangan huruf hijaiyah di sini
     adalah namanya dalam huruf Latin ("Ba"), jadi soalnya sama saja dengan
     Tunjuk, cuma namanya ditulis selain diucapkan. Untuk anak yang belum
     membaca Latin itu bukan bantuan, malah bisa tertukar dengan materi
     Huruf Besar dan Huruf Kecil. */
  if(t==="hijaiyah") return [STAGES[0],STAGES[2]];
  return STAGES;
}
function stageAktif(){
  var daftar=stagesFor();
  for(var i=0;i<daftar.length;i++) if(daftar[i][0]===S.stage) return S.stage;
  return daftar[0][0];
}
function stageInfo(id){
  var d=stagesFor();
  for(var i=0;i<d.length;i++) if(d[i][0]===id) return d[i];
  for(var j=0;j<STAGES.length;j++) if(STAGES[j][0]===id) return STAGES[j];
  return d[0];
}

function newQuestion(){
  if(kind()==="pattern") return newPattern();
  if(kind()==="kalimat") return newKalimat();
  var list=items();
  var target=list[Math.floor(Math.random()*list.length)];
  var opts=[target], guard=0, n=Math.min(S.choices,list.length);
  while(opts.length<n&&guard<400){
    var c=list[Math.floor(Math.random()*list.length)];
    if(opts.indexOf(c)<0) opts.push(c);
    guard++;
  }
  shuffle(opts);
  V.q={target:target,opts:opts,solved:false,wrongs:0,note:""};
}
/* Satu soal = satu kalimat dua kata. q.benar menyimpan jawaban tiap kotak,
   q.isi yang sudah terpasang, q.langkah kotak yang sedang diisi. */
function newKalimat(){
  var st=stageAktif();
  var tk=KALIMAT_TOKOH[Math.floor(Math.random()*KALIMAT_TOKOH.length)].id;
  var kg=KALIMAT_KEGIATAN[Math.floor(Math.random()*KALIMAT_KEGIATAN.length)];
  var opts=[], i;
  if(st==="lengkapi"){
    var n=Math.max(2,Math.min(S.choices,4));
    opts.push(tk+":"+kg);
    var sisa=shuffle(KALIMAT_KEGIATAN.filter(function(x){return x!==kg;}));
    for(i=0;i<sisa.length&&opts.length<n;i++) opts.push(tk+":"+sisa[i]);
    shuffle(opts);
  }else{
    /* dua kelompok pilihan dicampur jadi satu, masing-masing paling banyak
       tiga kartu supaya layarnya tidak penuh */
    /* Empat kartu muat satu baris di layar ponsel, enam kartu perlu dua
       baris dan mulai mendorong pilihan ke bawah layar. Jadi dua kartu per
       kelompok dipakai sampai setelan Pilihan saat latihan dinaikkan ke 4. */
    var nk=S.choices>=4?3:2;
    var pt=[tk], lain=shuffle(KALIMAT_TOKOH.map(function(x){return x.id;}).filter(function(x){return x!==tk;}));
    for(i=0;i<lain.length&&pt.length<nk;i++) pt.push(lain[i]);
    var pk=[tk+":"+kg], sk=shuffle(KALIMAT_KEGIATAN.filter(function(x){return x!==kg;}));
    for(i=0;i<sk.length&&pk.length<nk;i++) pk.push(tk+":"+sk[i]);
    opts=shuffle(pt.concat(pk));
  }
  V.q={kalimat:true, tokoh:tk, keg:kg, benar:[tk, tk+":"+kg],
       isi:(st==="lengkapi"?[tk,null]:[null,null]),
       langkah:(st==="lengkapi"?1:0),
       opts:opts, target:tk+":"+kg, solved:false, wrongs:0, note:""};
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

function tokenDots(){

function paintProgress(){

}
/* satu keping token tiap berhasil; lima keping berarti waktunya hadiah */
function tambahToken(lanjut){
  V.token++;
  paintProgress();
  if(V.token>=5&&S.reward!=="mati"){
    V.token=0;
    sesudahHadiah=lanjut;
    setTimeout(hadiah,700);
    return true;
  }
  return false;
}

/* Kalimat dijawab dua langkah, jadi bintang dan token baru diberikan setelah
   kotak kedua terisi. Kalau diberikan per kartu, anak dapat dua bintang untuk
   satu kalimat dan papan token penuh di tengah soal. */
function answerKalimat(btn){
  var q=V.q; if(!q||q.solved) return;
  var picked=btn.getAttribute("data-v");
  var note=main.querySelector(".done-note");
  var harus=q.benar[q.langkah];

  if(picked===harus){
    q.isi[q.langkah]=picked;
    q.langkah++;
    if(q.langkah<2){
      q.note="Lanjut";
      render();
      /* Kartu pertama sudah terpasang dan terbaca di layar, jadi yang
         diucapkan cukup penanda bahwa soalnya belum selesai. Katanya tidak
         diulang: kalimatnya ada di depan mata anak. */
      speak("lanjut","lahn-joot");
      return;
    }
    q.solved=true;
    V.streak++; S.stars++;
    /* Dicatat hanya kalau benar di percobaan pertama, sama seperti materi
       lain. Tahap Lengkapi dinilai 1, Susun dinilai 3. */
    if(q.wrongs===0){
      var nilai=stageAktif()==="susun"?3:1;
      var km=kenalMap(V.topic), kk=String(q.target);
      if(!km[kk]||km[kk]<nilai) km[kk]=nilai;
    }
    save();
    q.note="Benar";
    render();
    var n2=main.querySelector(".done-note");
    if(n2) n2.className="done-note ok";
    /* Cukup "benar", sama seperti materi lain. Kalimatnya sudah tersusun
       dan terbaca di layar, mengucapkannya lagi hanya menambah bunyi. */
    speak("benar","buh-nar");
    var lanjut=function(){ newQuestion(); render(); askQ(); };
    if(tambahToken(lanjut)) return;
    setTimeout(lanjut,1600);
    return;
  }

  btn.className="choice kartu again"; btn.disabled=true;
  q.wrongs++;
  if(note){note.textContent="Coba lagi";note.className="done-note";}

  if(S.helpQuiz&&q.wrongs>=2){
    var all=main.querySelectorAll(".choice");
    for(var i=0;i<all.length;i++){
      var v=all[i].getAttribute("data-v");
      if(v===harus) all[i].className="choice kartu hint";
      else { all[i].className="choice kartu again"; all[i].disabled=true; }
    }
    if(note) note.textContent="Yang ini";
    speak("yang ini","yahng ee-nee");
    return;
  }
  speak("coba lagi","choh-bah lah-gee");
}
function answer(btn){
  if(kind()==="kalimat") return answerKalimat(btn);
  var q=V.q; if(!q||q.solved) return;
  var picked=btn.getAttribute("data-v");
  var note=main.querySelector(".done-note");

  if(picked===String(q.target)){
    q.solved=true;
    btn.className="choice right";
    V.streak++; S.stars++;
    /* Dicatat hanya kalau benar di percobaan pertama. Setelah dua kali
       meleset pilihan yang salah dipudarkan, jadi jawaban benar sesudah itu
       belum tentu berarti anak mengenali. Yang disimpan tahap tertingginya:
       Sama 1, Pasang 2, Tunjuk 3. */
    if(q.wrongs===0&&kind()!=="pattern"){
      var st0=stageAktif(), nilai=st0==="tunjuk"?3:st0==="pasangkan"?2:1;
      var km=kenalMap(V.topic), kk=String(q.target);
      if(!km[kk]||km[kk]<nilai) km[kk]=nilai;
    }
    save();
    if(note){note.textContent="Benar";note.className="done-note ok";}
    speak("benar","buh-nar");
    var lanjut=function(){ newQuestion(); render(); askQ(); };
    if(tambahToken(lanjut)) return;
    setTimeout(lanjut,1200);
    return;
  }

  btn.className="choice again"; btn.disabled=true;
  q.wrongs++;
  if(note){note.textContent="Coba lagi";note.className="done-note";}

  /* Errorless learning: setelah dua kali meleset, pilihan yang salah
     ikut dipudarkan sampai tersisa yang benar, supaya anak tetap
     mengakhiri soal ini dengan keberhasilan, bukan kegagalan beruntun. */
  if(S.helpQuiz&&q.wrongs>=2){
    var all=main.querySelectorAll(".choice");
    for(var i=0;i<all.length;i++){
      var v=all[i].getAttribute("data-v");
      if(v===String(q.target)) all[i].className="choice hint";
      else { all[i].className="choice again"; all[i].disabled=true; }
    }
    if(note) note.textContent="Yang ini";
    speak("yang ini","yahng ee-nee");
    return;
  }
  speak("coba lagi","choh-bah lah-gee");
}

/* ===================== POLA ===================== */

function newPattern(){
  var pool=[];
  var sh=shuffle(SHAPES.map(function(s){return s.id;})).slice(0,3);
  var co=shuffle(COLORS.slice(0,8).map(function(c){return c.id;})).slice(0,3);
  for(var i=0;i<3;i++) pool.push({s:sh[i],c:co[i]});
  var rules=[[0,1],[0,0,1],[0,1,2]];
  var rule=rules[Math.floor(Math.random()*rules.length)];
  var seq=[], total=6;
  for(var j=0;j<total;j++) seq.push(pool[rule[j%rule.length]]);
  var answerEl=seq[total-1];
  var shown=seq.slice(0,total-1);
  var opts=[answerEl];
  for(var k=0;k<pool.length&&opts.length<Math.max(2,Math.min(S.choices,3));k++){
    if(pool[k]!==answerEl) opts.push(pool[k]);
  }
  shuffle(opts);
  V.q={pattern:true,shown:shown,opts:opts,target:idOf(answerEl),solved:false,wrongs:0,note:""};
}
function idOf(el){ return el.s+"|"+el.c; }
function cellHTML(el){ return '<span class="cell">'+svgShape(el.s,{fill:colorHex(el.c)})+'</span>'; }

function viewPatternQuiz(){
  var q=V.q, h='<div class="stage"><p class="ask">Apa yang muncul berikutnya?</p><div class="seq">';
  for(var i=0;i<q.shown.length;i++) h+=cellHTML(q.shown[i]);
  h+='<span class="cell ask-cell">?</span></div><div class="choices">';
  for(var j=0;j<q.opts.length;j++){
    h+='<button class="choice" data-act="answer" data-v="'+idOf(q.opts[j])+'">'+svgShape(q.opts[j].s,{fill:colorHex(q.opts[j].c)})+'</button>';
  }
  h+='</div><p class="done-note">'+esc(q.note||"")+'</p><div class="progress">'+tokenDots()+'</div></div>'+
  '<div class="controls"><button class="ctrl say" data-act="skip">Soal lain</button></div>';
  return h;
}

var jariAktif=null;
var PEN=16, TOL=20, RING=24, MARGIN=9;
/* Batas "boros gerakan". Menulis dan menebalkan huruf dengan benar terukur
   pada 1,0 sampai 6,3 kali jarak terpendek yang masuk akal; mengisi huruf
   dengan sapuan bolak-balik terukur 14,7 ke atas. Angka 8 duduk di antara
   keduanya dengan jarak lega ke dua sisi. */
var BATAS_SAPU=8;
/* Lapisan untuk mode stensil:
   bgCv   = garis panduan, digambar sekali tiap item
   inkCv  = coretan anak, sudah dipotong bentuk huruf
   maskCv = bentuk huruf solid, dipakai memotong coretan
   Coretan di luar huruf dibuang saat digambar, jadi tidak pernah membekas. */
var bgCv=null,inkCv=null,maskCv=null,DPR=1;
function stensilAktif(){ return S.stensil!=="bebas"; }
function kanvasBaru(){
  var cv=document.createElement("canvas");
  cv.width=Math.round(padW*DPR); cv.height=Math.round(padH*DPR);
  var c=cv.getContext("2d"); c.setTransform(DPR,0,0,DPR,0,0);
  return {cv:cv,c:c};
}
/* salin satu bagian persegi dari kanvas lain, memakai piksel perangkat */
function salin(tujuan,sumber,x,y,w,h){
  tujuan.save(); tujuan.setTransform(1,0,0,1,0,0);
  var X=Math.max(0,Math.floor(x*DPR)), Y=Math.max(0,Math.floor(y*DPR));
  var W=Math.min(Math.ceil(w*DPR),Math.round(padW*DPR)-X);
  var H=Math.min(Math.ceil(h*DPR),Math.round(padH*DPR)-Y);
  if(W>0&&H>0) tujuan.drawImage(sumber,X,Y,W,H,X,Y,W,H);
  tujuan.restore();
}
var LEVELS={longgar:{cov:.55,acc:.42},sedang:{cov:.70,acc:.58},teliti:{cov:.84,acc:.70}};
function level(){ return LEVELS[S.writeLevel]||LEVELS.longgar; }

function curKey(){ return String(items()[V.idx]); }
function isWritten(){ return !!doneMap(V.topic)[curKey()]; }
/* Kunci saat menulis hanya menjaga tombol Lanjut selama anak berada di tab
   Menulis. Nomor item dipakai bersama dengan tab Belajar, jadi kalau anak
   menggeser sampai D di Belajar lalu pindah ke Menulis, dia mendarat di D
   padahal A, B, C belum ditulis. Fungsi ini memberi batasnya: item pertama
   yang belum selesai. Kalau semuanya sudah selesai, tidak ada yang dibatasi. */
function batasTulis(){
  var list=items(), d=doneMap(V.topic);
  for(var i=0;i<list.length;i++) if(!d[String(list[i])]) return i;
  return list.length-1;
}
function cnt(t){ var n=0,d=S.done[t]||{}; for(var k in d) n++; return n; }
function daftarMateri(){
  var h='<div class="materi">';
  for(var g=0;g<KELOMPOK.length;g++){
    for(var i=0;i<KELOMPOK[g].isi.length;i++){
      var t=KELOMPOK[g].isi[i];
      var tampil=!(S.sembunyi&&S.sembunyi[t]);
      h+='<button data-act="toggle-materi" data-topic="'+t+'" aria-pressed="'+tampil+'">'+KARTU[t][1]+'</button>';
    }
  }
  return h+'</div>';
}

/* Prompt fading: bantuan menyusut seiring anak makin mahir. */
function guideMode(){
  if(S.writeGuide!=="otomatis") return S.writeGuide;
  var n=cnt(V.topic);
  if(n<6) return "penuh";
  if(n<14) return "garis";
  return "samar";
}

function viewWrite(){
  var list=items(), cur=String(list[V.idx]);
  var done=isWritten(), locked=S.writeLock&&!done;
  var g=guideMode();
  var gLabel=g==="penuh"?"bantuan penuh":g==="garis"?"garis tepi":"garis samar";
  return '<div class="canvas-wrap"><canvas id="pad"></canvas>'+
  '<button class="demo-btn" id="w-demo" data-act="contoh" hidden>&#9655; Caranya</button>'+
  '<div class="stamp'+(done?" show":"")+'" id="w-stamp" aria-hidden="true">&#10003;</div></div>'+
  '<div class="gauge" aria-hidden="true"><i id="w-bar" class="'+(done?"ok":"")+'" style="width:'+(done?100:0)+'%"></i></div>'+
  '<p class="status'+(done?" ok":"")+'" id="w-status" role="status">'+
    (done?"Sudah pas":"Tebalkan "+kindWord()+" "+esc(namaOf(cur)))+'</p>'+
  '<div class="progress">'+tokenDots()+'</div>'+
  '<div class="counter">Ke '+(V.idx+1)+' dari '+list.length+', selesai '+cnt(V.topic)+', '+gLabel+'</div>'+
  '<div class="controls">'+
  '<button class="ctrl" data-act="prev" aria-label="Sebelumnya"'+(V.idx===0?" disabled":"")+'>&#8592;</button>'+
  '<button class="ctrl say" data-act="clear">&#9003; Hapus</button>'+
  '<button class="ctrl'+(locked?" locked":"")+'" id="w-next" data-act="next" aria-label="Berikutnya"'+
    (V.idx===list.length-1?" disabled":"")+'>&#8594;</button>'+
  '</div>';
}

function mountCanvas(){
  pad=document.getElementById("pad"); if(!pad) return;
  strokes=[]; drawing=false; jariAktif=null;
  var r=pad.parentNode.getBoundingClientRect();
  padW=Math.max(80,r.width); padH=Math.max(80,r.height);
  var dpr=Math.min(window.devicePixelRatio||1,2);
  pad.width=Math.round(padW*dpr); pad.height=Math.round(padH*dpr);
  pctx=pad.getContext("2d");
  DPR=dpr;
  pctx.setTransform(dpr,0,0,dpr,0,0);
  geom=buildGeom(pctx,padW,padH,String(items()[V.idx]));
  siapkanLapisan();
  redraw();

  /* Jalur contoh disiapkan sekali tiap huruf, lalu diperiksa ke bentuk huruf
     yang benar-benar tampil di perangkat ini. */
  anim=null; animStrokes=null;
  var jl=(S.contoh==="mati")?null:jalurItem();
  animStrokes=(jl&&jalurPas(jl))?jl:false;
  var tb=document.getElementById("w-demo");
  if(tb) tb.hidden=!animStrokes;
  /* Diputar sendiri hanya saat huruf ini belum pernah selesai, jadi anak yang
     sudah hafal tidak ditahan menonton ulang tiap kali membuka. */
  if(animStrokes&&S.contoh==="otomatis"&&!isWritten()) setTimeout(mainkanContoh,260);

  /* Menulis itu dengan satu jari. Jari kedua diabaikan, bukan dilarang
     dengan nada menyalahkan: anak cuma diberi tahu sekali, lembut. */
  pad.onpointerdown=function(e){
    e.preventDefault();
    /* Anak yang sudah mau menulis tidak ditahan: sentuhan menghentikan contoh
       dan langsung jadi goresan pertama. */
    if(anim) hentikanContoh();
    if(jariAktif!==null){
      if(!isWritten()) setStatus("Pakai satu jari ya",false);
      return;
    }
    jariAktif=e.pointerId; drawing=true;
    try{pad.setPointerCapture(e.pointerId);}catch(_){}
    curStroke=[pos(e)]; strokes.push(curStroke);
    var p=curStroke[0];
    goresKe(p,p);
  };
  pad.onpointermove=function(e){
    if(!drawing||e.pointerId!==jariAktif) return;
    var p=pos(e), q=curStroke[curStroke.length-1];
    curStroke.push(p);
    goresKe(q,p);
  };
  pad.onpointerup=pad.onpointercancel=function(e){
    if(e&&e.pointerId!==jariAktif) return;
    jariAktif=null;
    if(!drawing) return;
    drawing=false; evaluate();
  };
}
/* Menggambar satu ruas coretan. Dengan stensil, ruas digambar di lapisan
   tinta lalu bagian yang keluar dari huruf langsung dihapus, dan hanya
   kotak kecil di sekitar ruas itu yang digambar ulang ke layar. */
function goresKe(a,b){
  if(!stensilAktif()||!inkCv){
    penStyle(pctx,1,PEN); pctx.strokeStyle=cssVar("--accent","#4f7d8c");
    pctx.beginPath(); pctx.moveTo(a.x,a.y); pctx.lineTo(b.x+(a===b?.01:0),b.y); pctx.stroke();
    return;
  }
  var ic=inkCv.c;
  penStyle(ic,1,PEN); ic.strokeStyle=cssVar("--accent","#4f7d8c");
  ic.globalCompositeOperation="source-over";
  ic.beginPath(); ic.moveTo(a.x,a.y); ic.lineTo(b.x+(a===b?.01:0),b.y); ic.stroke();

  var m=PEN/2+3;
  var x=Math.min(a.x,b.x)-m, y=Math.min(a.y,b.y)-m;
  var w=Math.abs(b.x-a.x)+m*2, h=Math.abs(b.y-a.y)+m*2;

  /* buang bagian ruas ini yang berada di luar huruf */
  ic.save();
  ic.beginPath(); ic.rect(x,y,w,h); ic.clip();
  ic.globalCompositeOperation="destination-in";
  ic.setTransform(1,0,0,1,0,0);
  ic.drawImage(maskCv.cv,0,0);
  ic.restore();
  ic.globalCompositeOperation="source-over";

  pctx.clearRect(x,y,w,h);
  salin(pctx,bgCv.cv,x,y,w,h);
  salin(pctx,inkCv.cv,x,y,w,h);
}
function pos(e){var r=pad.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function cssVar(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}
function penStyle(c,scale,w){c.lineWidth=w*scale;c.lineCap="round";c.lineJoin="round";}

function glyphFont(px){
  return '700 '+px+'px '+(kind()==="hijaiyah"
    ? '"Noto Naskh Arabic","Noto Sans Arabic",serif'
    : 'Andika, sans-serif');
}
function buildGeom(c,w,h,id){
  if(kind()==="shape"){
    var box=Math.min(w,h)*0.92;
    return {kind:"path",d:shapeD(id),box:box,dx:(w-box)/2,dy:(h-box)/2};
  }
  /* Hijaiyah memakai jalur sendiri, bukan bentuk font (4.9). Kotak tintanya
     dipaskan ke kanvas tanpa menggepengkan huruf: skalanya tetap seragam,
     diambil yang paling pas antara lebar dan tinggi. */
  if(kind()==="hijaiyah"&&HIJ_JALUR[id]){
    var J=HIJ_JALUR[id];
    /* Jalur ini garis tengah, sedangkan yang tergambar adalah pita setebal
       pena. Pitanya melebar RING/2+MARGIN ke kiri dan ke kanan jalur, jadi
       tempat untuk itu harus disisihkan dulu, kalau tidak huruf lebar seperti
       Jim terpotong tepi kanvas. */
    var sisi=RING/2+MARGIN+10;
    var aw=Math.max(20,w-2*sisi), ah=Math.max(20,h-2*sisi);
    var box=Math.min(aw*100/J.w, ah*100/J.h);
    return {kind:"path", d:J.g.join(" "), sub:J.g, box:box,
            dx:(w-J.w*box/100)/2, dy:(h-J.h*box/100)/2};
  }
  var size=Math.min(h*0.88,w*0.94);
  /* huruf Arab punya badan lebih kecil dari kotak fontnya, jadi diberi tambahan */
  if(kind()==="hijaiyah") size*=1.12;
  c.font=glyphFont(size);
  var tw=c.measureText(id).width;
  if(tw>w*0.94) size=size*(w*0.94)/tw;
  return {kind:"text",text:id,size:size,x:w/2,y:h/2};
}
/* satu bentuk dipakai dua kali: inti (core) dan zona toleransi (zone) */
function corePaint(c,sc,mode){
  if(geom.kind==="text"){
    c.font=glyphFont(geom.size*sc);
    c.textAlign="center"; c.textBaseline="middle";
    if(mode==="zone"||mode==="stensil"){
      c.lineWidth=(mode==="stensil"?MARGIN:TOL)*2*sc; c.lineJoin="round"; c.strokeStyle="#000";
      c.strokeText(geom.text,geom.x*sc,geom.y*sc);
    }
    c.fillStyle="#000"; c.fillText(geom.text,geom.x*sc,geom.y*sc);
    return;
  }
  var u=(geom.box/100)*sc;
  c.save(); c.translate(geom.dx*sc,geom.dy*sc); c.scale(u,u);
  c.lineJoin="round"; c.lineCap="round"; c.strokeStyle="#000";
  c.lineWidth=((mode==="zone"?RING+TOL*2:mode==="stensil"?RING+MARGIN*2:RING)*100)/geom.box;
  c.stroke(new Path2D(geom.d));
  c.restore();
}
function siapkanLapisan(){
  bgCv=inkCv=maskCv=null;
  if(!stensilAktif()) return;
  bgCv=kanvasBaru(); inkCv=kanvasBaru(); maskCv=kanvasBaru();
  corePaint(maskCv.c,1,"stensil");
}
function drawGhost(){
  /* dengan stensil, panduan digambar ke lapisan sendiri supaya layar
     bisa diperbaiki per bagian kecil tanpa menggambar ulang semuanya */
  var target = (stensilAktif()&&bgCv) ? bgCv.c : pctx;
  var simpan = pctx;
  pctx = target;
  pctx.clearRect(0,0,padW,padH);
  var g=guideMode();
  var soft=cssVar("--accent-soft","#d8e5e9"), line=cssVar("--muted","#67787f");
  pctx.save();
  if(g==="samar") pctx.globalAlpha=.35;
  if(geom.kind==="text"){
    pctx.font=glyphFont(geom.size);
    pctx.textAlign="center"; pctx.textBaseline="middle";
    if(g==="penuh"){ pctx.fillStyle=soft; pctx.fillText(geom.text,geom.x,geom.y); }
    pctx.setLineDash([9,9]); pctx.lineWidth=2; pctx.strokeStyle=line;
    pctx.strokeText(geom.text,geom.x,geom.y);
  }else{
    var u=geom.box/100;
    pctx.translate(geom.dx,geom.dy); pctx.scale(u,u);
    pctx.lineJoin="round"; pctx.lineCap="round";
    var path=new Path2D(geom.d);
    if(g==="penuh"){ pctx.strokeStyle=soft; pctx.lineWidth=(RING*100)/geom.box; pctx.stroke(path); }
    pctx.setLineDash([9,9]); pctx.lineWidth=(2*100)/geom.box; pctx.strokeStyle=line; pctx.stroke(path);
  }
  pctx.restore();

  /* Petunjuk diam bahwa hanya bagian dalam huruf yang bisa ditulisi:
     bidang huruf diberi semburat tipis, seperti lubang pada stensil. */
  if(stensilAktif()&&bgCv){
    pctx.save(); pctx.globalAlpha=0.16; pctx.fillStyle=cssVar("--accent","#4f7d8c");
    pctx.globalCompositeOperation="destination-over";
    corePaint(pctx,1,"stensil");
    pctx.restore();
  }
  pctx = simpan;
  if(stensilAktif()&&bgCv){ pctx.clearRect(0,0,padW,padH); salin(pctx,bgCv.cv,0,0,padW,padH); }
}
function drawStrokes(c,sc,width){
  penStyle(c,sc,width); c.strokeStyle="#000";
  for(var i=0;i<strokes.length;i++){
    var s=strokes[i]; if(!s.length) continue;
    c.beginPath(); c.moveTo(s[0].x*sc,s[0].y*sc);
    if(s.length===1) c.lineTo(s[0].x*sc+.01,s[0].y*sc);
    else for(var j=1;j<s.length;j++) c.lineTo(s[j].x*sc,s[j].y*sc);
    c.stroke();
  }
}
function garisStroke(c){
  penStyle(c,1,PEN); c.strokeStyle=cssVar("--accent","#4f7d8c");
  for(var i=0;i<strokes.length;i++){
    var s=strokes[i]; if(!s.length) continue;
    c.beginPath(); c.moveTo(s[0].x,s[0].y);
    if(s.length===1) c.lineTo(s[0].x+.01,s[0].y);
    else for(var j=1;j<s.length;j++) c.lineTo(s[j].x,s[j].y);
    c.stroke();
  }
}
function redraw(){
  if(!pctx||!geom) return;
  drawGhost();
  if(stensilAktif()&&inkCv){
    var ic=inkCv.c;
    ic.setTransform(DPR,0,0,DPR,0,0);
    ic.clearRect(0,0,padW,padH);
    garisStroke(ic);
    ic.save(); ic.globalCompositeOperation="destination-in";
    ic.setTransform(1,0,0,1,0,0); ic.drawImage(maskCv.cv,0,0); ic.restore();
    ic.globalCompositeOperation="source-over";
    salin(pctx,inkCv.cv,0,0,padW,padH);
    return;
  }
  garisStroke(pctx);
}

   Font hanya menyimpan bentuk luar huruf, bukan garis tengahnya dan bukan
   urutan goresannya. Jadi jalur di bawah ini ditulis tangan: tiap huruf
   berisi daftar goresan, urutan larik adalah urutan menulis, dan arah path
   adalah arah tangan bergerak. Koordinat 0..100 nanti dipetakan ke kotak
   tinta huruf yang sebenarnya, jadi jalurnya ikut berapa pun ukuran huruf.

   Jalur ini sudah diuji: kalau ditelusuri persis, hasilnya lolos penilaian
   menulis di ketiga tingkat ketelitian, dengan rasio gerakan 1,5 - 3,0 kali
   (batas menyapu 8). Artinya contoh yang ditunjukkan memang jawaban benar,
   bukan gerakan yang nanti ditolak aplikasinya sendiri. */
/* Jalur huruf hijaiyah (4.9).
   Berbeda dari huruf Latin yang jalurnya hanya dipakai untuk contoh cara

   jalur ini untuk DUA-DUANYA: ditebalkan dengan pena bundar jadi stensilnya,
   dan ditelusuri titik berjalan jadi contohnya. Dengan begitu jalur dan
   stensil mustahil berselisih, dan menulis hijaiyah tidak lagi bergantung
   pada font Arab yang bisa saja belum terunduh.

   tengah, satu larik per goresan, urut sesuai urutan menulis, arah path

var anim=null, animStrokes=null;

/* Kotak tinta huruf: tempat koordinat 0..100 dipetakan. Dipakai kotak
   nyata glyph, bukan kotak font, supaya jalur pas di huruf sempit (I)
   maupun lebar (W). */
/* Kotak tinta tiap huruf dalam teks. Angka seperti 27 ditulis dua angka
   berurutan, jadi tiap angka dapat kotaknya sendiri dan contohnya berjalan
   dari angka pertama ke angka kedua, persis urutan menulisnya. */
function kotakHuruf(){
  var c=document.createElement("canvas").getContext("2d");
  c.font=glyphFont(geom.size); c.textAlign="left"; c.textBaseline="middle";
  var t=geom.text, x=geom.x-c.measureText(t).width/2, out=[];
  for(var i=0;i<t.length;i++){
    var ch=t.charAt(i), m=c.measureText(ch);
    if(!m||m.actualBoundingBoxLeft===undefined) return null;
    var w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight;
    var h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
    if(w>1&&h>1) out.push({ch:ch, x:x-m.actualBoundingBoxLeft,
                           y:geom.y-m.actualBoundingBoxAscent, w:w, h:h});
    x+=m.width;
  }
  return out.length?out:null;
}
function titikJalur(d,ubah){
  var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("width","0"); svg.setAttribute("height","0");
  svg.style.cssText="position:absolute;width:0;height:0;overflow:hidden";
  var el=document.createElementNS("http://www.w3.org/2000/svg","path");
  el.setAttribute("d",d); svg.appendChild(el); document.body.appendChild(svg);
  var out=[];
  try{
    var L=el.getTotalLength(), step=Math.max(.5,L/200);
    for(var t=0;t<L;t+=step) out.push(ubah(el.getPointAtLength(t)));
    out.push(ubah(el.getPointAtLength(L)));
  }catch(_){}
  svg.parentNode.removeChild(svg);
  return out;
}
/* Jalur untuk huruf yang sedang dibuka, atau null kalau tidak ada. */
function jalurItem(){
  if(!geom) return null;
  if(geom.kind==="path"){
    var u=geom.box/100, dx=geom.dx, dy=geom.dy;
    var ubah=function(q){return {x:dx+q.x*u, y:dy+q.y*u};};
    /* Bentuk cuma punya satu jalur, hijaiyah bisa beberapa goresan:
       badan huruf dulu, lalu titik-titiknya, masing-masing jadi goresan
       tersendiri supaya contohnya berhenti sejenak di tiap awal goresan. */
    var daftar=geom.sub||[geom.d], out=[];
    for(var i=0;i<daftar.length;i++){
      var t=titikJalur(daftar[i],ubah);
      if(t.length>1) out.push(t);
    }
    return out.length?out:null;
  }
  var kk=kotakHuruf(); if(!kk) return null;
  var out=[];
  for(var h=0;h<kk.length;h++){
    var dd=GORESAN[kk[h].ch]; if(!dd) return null;
    for(var i=0;i<dd.length;i++){
      var t2=titikJalur(dd[i],(function(bx){ return function(q){
        return {x:bx.x+(q.x/100)*bx.w, y:bx.y+(q.y/100)*bx.h};
      };})(kk[h]));
      if(t2.length) out.push(t2);
    }
  }
  return out.length?out:null;
}
/* Pengaman: jalur ditulis tangan, sedangkan huruf digambar oleh font yang
   bisa saja berbeda di tiap perangkat (Andika belum terunduh, misalnya).
   Jadi sebelum diputar, jalurnya diperiksa dulu ke bentuk huruf yang
   benar-benar tampil. Kalau banyak meleset, contohnya tidak ditampilkan
   sama sekali, lebih baik diam daripada mengajarkan jalan yang salah. */
function jalurPas(ss){
  var sc=Math.min(1,200/Math.max(padW,padH));
  var W=Math.max(40,Math.round(padW*sc)), H=Math.max(40,Math.round(padH*sc));
  var a=alphaOf(W,H,function(c){corePaint(c,sc,"stensil");});
  var n=0,masuk=0;
  for(var i=0;i<ss.length;i++) for(var j=0;j<ss[i].length;j++){
    var x=Math.round(ss[i][j].x*sc), y=Math.round(ss[i][j].y*sc);
    if(x<0||y<0||x>=W||y>=H){n++;continue;}
    n++; if(a[(y*W+x)*4+3]>24) masuk++;
  }
  return n>0 && masuk/n>=0.9;
}
function hentikanContoh(){
  if(!anim) return;
  if(anim.raf) cancelAnimationFrame(anim.raf);
  anim=null;
  var b=document.getElementById("w-demo"); if(b) b.className="demo-btn";
  if(pctx&&geom) redraw();
}
function adaContoh(){
  if(!geom||S.contoh==="mati") return false;
  if(!animStrokes) animStrokes=jalurItem()||false;
  return !!animStrokes;
}
/* Titik berjalan menyusuri huruf, satu goresan demi satu goresan, dengan
   jeda singkat di tiap awal goresan supaya terlihat jelas mulainya dari mana. */
function mainkanContoh(){
  if(!pctx||!geom) return;
  hentikanContoh();
  if(!adaContoh()) return;
  var ss=animStrokes;
  var b=document.getElementById("w-demo"); if(b) b.className="demo-btn main";
  var panjang=ss.map(function(s){
    var t=0; for(var i=1;i<s.length;i++){
      var dx=s[i].x-s[i-1].x, dy=s[i].y-s[i-1].y; t+=Math.sqrt(dx*dx+dy*dy);
    } return Math.max(1,t);
  });
  anim={i:0, t:0, mulai:0, raf:0};
  var LAJU=190, TAHAN=420, JEDA=300;
  var warna=cssVar("--accent","#4f7d8c");

  function gambar(sampai){
    redraw();
    pctx.save();
    penStyle(pctx,1,PEN);
    /* goresan yang sudah lewat tetap terlihat, lebih pudar */
    pctx.globalAlpha=.5; pctx.strokeStyle=warna;
    for(var i=0;i<anim.i;i++) jalan(ss[i],ss[i].length-1);
    pctx.globalAlpha=.85; jalan(ss[anim.i],sampai);
    pctx.restore();
    var p=ss[anim.i][Math.max(0,Math.min(sampai,ss[anim.i].length-1))];
    pctx.save();
    pctx.fillStyle=warna; pctx.globalAlpha=.22;
    pctx.beginPath(); pctx.arc(p.x,p.y,PEN*1.15,0,6.3); pctx.fill();
    pctx.globalAlpha=1; pctx.fillStyle=warna;
    pctx.beginPath(); pctx.arc(p.x,p.y,PEN*0.46,0,6.3); pctx.fill();
    pctx.strokeStyle="#fff"; pctx.lineWidth=3;
    pctx.beginPath(); pctx.arc(p.x,p.y,PEN*0.46,0,6.3); pctx.stroke();
    pctx.restore();
  }
  function jalan(s,sampai){
    if(!s.length) return;
    pctx.beginPath(); pctx.moveTo(s[0].x,s[0].y);
    for(var j=1;j<=sampai&&j<s.length;j++) pctx.lineTo(s[j].x,s[j].y);
    if(sampai<1) pctx.lineTo(s[0].x+.01,s[0].y);
    pctx.stroke();
  }
  function langkah(now){
    if(!anim) return;
    if(!anim.mulai) anim.mulai=now;
    var lewat=now-anim.mulai;
    if(lewat<TAHAN){ gambar(0); anim.raf=requestAnimationFrame(langkah); return; }
    var maju=(lewat-TAHAN)/1000*LAJU;
    var frac=maju/panjang[anim.i];
    if(frac>=1){
      gambar(ss[anim.i].length-1);
      anim.i++;
      if(anim.i>=ss.length){
        anim.raf=0;
        setTimeout(function(){ if(anim){ anim=null;
          var bb=document.getElementById("w-demo"); if(bb) bb.className="demo-btn";
          redraw(); } }, JEDA*2);
        return;
      }
      anim.mulai=now+JEDA;
      anim.raf=requestAnimationFrame(langkah); return;
    }
    gambar(Math.floor(frac*(ss[anim.i].length-1)));
    anim.raf=requestAnimationFrame(langkah);
  }
  anim.raf=requestAnimationFrame(langkah);
}
/* Panjang seluruh coretan, dipakai membedakan menulis dari mewarnai:
   menulis menempuh jarak pendek, mewarnai bolak-balik jauh lebih panjang. */
function panjangCoretan(){
  var t=0;
  for(var i=0;i<strokes.length;i++){
    var s=strokes[i];
    for(var j=1;j<s.length;j++){
      var dx=s[j].x-s[j-1].x, dy=s[j].y-s[j-1].y;
      t+=Math.sqrt(dx*dx+dy*dy);
    }
  }
  return t;
}
function alphaOf(w,h,paint){
  var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  var c=cv.getContext("2d"); paint(c);
  return c.getImageData(0,0,w,h).data;
}
function evaluate(){
  if(!geom||!strokes.length) return;
  var sc=Math.min(1,240/Math.max(padW,padH));
  var AW=Math.max(40,Math.round(padW*sc)), AH=Math.max(40,Math.round(padH*sc));
  /* Dengan stensil, yang benar-benar tergambar hanyalah bagian di dalam
     huruf, jadi penilaian memakai tinta yang sudah dipotong juga. */
  var pakaiStensil=stensilAktif();
  /* Bentuk stensil disiapkan utuh di kanvas tersendiri lebih dulu.
     Kalau digambar langsung dengan destination-in, garis tepi dan isian
     huruf memotong dua kali berturut-turut dan yang tersisa cuma cincin
     tepinya, sehingga penilaian jadi jauh terlalu ketat. */
  var cvStensil=null;
  if(pakaiStensil){
    cvStensil=document.createElement("canvas");
    cvStensil.width=AW; cvStensil.height=AH;
    corePaint(cvStensil.getContext("2d"),sc,"stensil");
  }
  var potong=function(lebar){
    return function(c){
      drawStrokes(c,sc,lebar);
      if(!pakaiStensil) return;
      c.save(); c.globalCompositeOperation="destination-in";
      c.drawImage(cvStensil,0,0); c.restore();
    };
  };
  var core=alphaOf(AW,AH,function(c){corePaint(c,sc,"fill");});
  var zone=alphaOf(AW,AH,function(c){corePaint(c,sc,"zone");});
  var ink =alphaOf(AW,AH,potong(PEN));
  var fat =alphaOf(AW,AH,potong(PEN+20));

  var coreN=0,coreHit=0,inkN=0,inkIn=0;
  for(var i=3;i<core.length;i+=4){
    if(core[i]>24){coreN++; if(fat[i]>24) coreHit++;}
    if(ink[i]>24){inkN++; if(zone[i]>24) inkIn++;}
  }
  var cov=coreN?coreHit/coreN:0, acc=inkN?inkIn/inkN:0, L=level();
  var enough=inkN>(AW*AH*0.004);
  /* Ketepatan tidak dinilai saat stensil aktif: coretan memang tidak
     mungkin keluar, jadi yang tersisa untuk dinilai hanya kelengkapannya. */
  var tepat=pakaiStensil||acc>=L.acc;
  /* Huruf bisa saja tertutup penuh tanpa anak benar-benar menulis, misalnya
     dengan menyapu bolak-balik. Yang membedakan adalah jarak yang ditempuh
     jari: menulis menempuh jarak pendek, menyapu berkali-kali lipat.
     Diperiksa sebelum bilah digambar, supaya bilah tidak terlanjur hijau. */
  var panjang=panjangCoretan();
  var perlu=(coreN/(sc*sc))*L.cov/(PEN+20);
  var rasio=panjang/Math.max(1,perlu);
  var menyapu=(S.antiSapu!==false)&&enough&&rasio>BATAS_SAPU;
  var pass=enough&&cov>=L.cov&&tepat&&!menyapu;

  var bar=document.getElementById("w-bar");
  if(bar){
    /* saat ditolak, bilah menunjukkan sebagian saja: huruf memang tertutup,
       tapi belum terhitung sebagai menulis */
    bar.style.width=(menyapu?30:Math.min(100,Math.round(cov/L.cov*100)))+"%";
    bar.className=pass?"ok":"";
  }

  window.__ukur={cov:cov,acc:acc,panjang:Math.round(panjang),perlu:Math.round(perlu),
                 rasio:+rasio.toFixed(2),goresan:strokes.length,menyapu:menyapu,lulus:pass};

  if(pass) finishItem();
  else if(!enough) setStatus("Mulai tebalkan garisnya",false);
  else if(menyapu) setStatus("Tekan Hapus, lalu ikuti bentuk hurufnya",false);
  else if(!tepat) setStatus("Ikuti garisnya ya",false);
  else setStatus("Bagus, masih ada bagian yang kosong",false);
}
function setStatus(text,ok){
  var el=document.getElementById("w-status");

}
function finishItem(){

}

/* ===================== PENCAPAIAN =====================
   Halaman untuk orang tua dan terapis. Isinya hanya yang benar-benar
   tercatat: item yang sudah selesai ditulis, dan item yang dikenali anak
   di percobaan pertama saat latihan. Yang tidak tercatat tidak dikarang,
   dan Belajar memang tidak dihitung karena membuka halaman bukan tanda
   anak sudah bisa. */
function jumlahSemua(t){
  var k=TOPICS[t].kind;
  if(k==="letter") return 26;
  if(k==="num") return S.range||100;
  if(k==="hijaiyah") return HIJAIYAH.length;
  if(k==="shape") return SHAPES.length;
  if(k==="color") return COLORS.length;
  if(k==="profesi") return PROFESI.length;
  if(k==="buah") return BUAH.length;
  if(k==="kendaraan") return KENDARAAN.length;
  if(k==="aktivitas") return AKTIVITAS.length;
  if(k==="benda") return BENDA_RUMAH.length;
  if(k==="kalimat") return KALIMAT_TOKOH.length*KALIMAT_KEGIATAN.length;
  return 0;
}
/* Materi Menyusun Kalimat tidak punya tahap Tunjuk, tahap tertingginya Susun. */
function labelTahapTinggi(t){
  return TOPICS[t].kind==="kalimat" ? "Sampai tahap Susun" : "Sampai tahap Tunjuk";
}
function hitungKenal(t){
  var d=S.kenal[t]||{}, n=0, tunjuk=0;
  for(var k in d){ n++; if(d[k]>=3) tunjuk++; }
  return {jumlah:n, tunjuk:tunjuk};
}
function punyaTulis(t){ return TOPICS[t].tabs.indexOf("tulis")>=0; }
function kartuCapai(t){
  var tint=TINT[t]||"var(--accent)", total=jumlahSemua(t);
  var h='<div class="capai" style="--tint:'+tint+'"><h4>'+KARTU[t][1]+'</h4>';
  if(t==="pattern") return h+'<div class="kosong">Pola tidak dicatat per item, soalnya dibuat baru setiap kali.</div></div>';
  if(punyaTulis(t)){
    var d=cnt(t);
    h+='<div class="baris"><span>Sudah ditulis</span><b>'+d+' dari '+total+'</b></div>'+
       '<span class="bar"><u style="width:'+Math.round(Math.min(1,total?d/total:0)*100)+'%"></u></span>';
  }
  var k=hitungKenal(t);
  h+='<div class="baris"><span>Dikenali saat latihan</span><b>'+k.jumlah+' dari '+total+'</b></div>';
  if(k.jumlah) h+='<div class="baris"><span>'+labelTahapTinggi(t)+'</span><b>'+k.tunjuk+'</b></div>';
  return h+'</div>';
}
function viewPencapaian(){
  var h='<div class="doc">'+
    '<p class="kecil">Catatan untuk orang tua dan terapis. Tidak ada yang perlu '+
    'dikejar di sini, dan angka yang diam bukan berarti anak mundur.</p>'+
    '<div class="capai" style="--tint:var(--star)"><h4>Bintang</h4>'+
    '<div class="baris"><span>Terkumpul</span><b>'+S.stars+'</b></div></div>';
  for(var g=0;g<KELOMPOK.length;g++){

      var t=KELOMPOK[g].isi[i];
      if(S.sembunyi&&S.sembunyi[t]) continue;
      h+=kartuCapai(t);
    }
  }
  return h+'<button class="mailbtn" data-act="salin-capai" id="salin-capai">Salin ringkasan</button>'+
    '<div class="seg"><button data-act="reset-kenal">Ulang catatan latihan</button></div>'+

/* Ringkasan teks supaya orang tua tinggal menempelkannya ke pesan untuk
   terapis. Kalau papan klip ditolak browser, teksnya ditampilkan saja. */
function teksRingkasan(){
  var b=[APP.nama+" - ringkasan pencapaian","Bintang terkumpul: "+S.stars,""];
  for(var g=0;g<KELOMPOK.length;g++){
    for(var i=0;i<KELOMPOK[g].isi.length;i++){
      var t=KELOMPOK[g].isi[i];
      if((S.sembunyi&&S.sembunyi[t])||t==="pattern") continue;
      var tot=jumlahSemua(t), k=hitungKenal(t), baris=KARTU[t][1]+": ";
      if(punyaTulis(t)) baris+="ditulis "+cnt(t)+" dari "+tot+", ";
      baris+="dikenali "+k.jumlah+" dari "+tot;
      if(k.jumlah) baris+=" ("+k.tunjuk+" "+labelTahapTinggi(t).toLowerCase()+")";
      b.push(baris);
    }
  }
  return b.join("\n");
}
function salinRingkasan(){
  var teks=teksRingkasan(), el=document.getElementById("salin-capai");
  var ok=function(){
    if(!el) return;
    el.textContent="Tersalin";
    setTimeout(function(){ if(el) el.textContent="Salin ringkasan"; },2000);
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(teks).then(ok,function(){ tampilRingkasan(teks); });
      return;
    }
  }catch(e){}
  tampilRingkasan(teks);
}
function tampilRingkasan(teks){
  if(document.getElementById("ov")) return;
  var wrap=document.createElement("div");
  wrap.innerHTML='<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true">'+
    '<h3>Ringkasan</h3><p class="kecil">Papan klip tidak bisa dipakai di sini, '+
    'jadi teksnya ditampilkan supaya bisa disalin sendiri.</p>'+
    '<p class="ringkas">'+esc(teks)+'</p>'+
    '<button class="dlgbtn utama" data-dlg="tutup">Tutup</button></div></div>';
  var ov=wrap.firstChild;
  document.body.appendChild(ov);
  ov.addEventListener("click",function(e){
    if(e.target===ov||e.target.closest("[data-dlg]")) closeNotice();
  });
}

/* ===================== HADIAH =====================
   Suara kereta dibangkitkan lewat Web Audio, bukan file audio, supaya
   paket tetap kecil dan tetap jalan tanpa internet. Sengaja pelan dan
   tidak mendadak: deru dulu, peluit di akhir.                        */

var AC=null;
function audioCtx(){
  try{
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
    if(AC.state==="suspended") AC.resume();
    return AC;
  }catch(e){ return null; }
}
function deru(ctx,t0,keras){
  /* satu hentakan uap: desis pendek yang diredam */
  var n=Math.floor(ctx.sampleRate*0.22);
  var buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1);
  var src=ctx.createBufferSource(); src.buffer=buf;
  var bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=420; bp.Q.value=1.1;
  var g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(keras,t0+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(t0); src.stop(t0+0.24);
}
function peluit(ctx,t0){
  var g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.16,t0+0.12);
  g.gain.setValueAtTime(0.16,t0+0.55);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+1.0);
  g.connect(ctx.destination);
  [520,660].forEach(function(f,i){
    var o=ctx.createOscillator();
    o.type="sine"; o.frequency.value=f*(i?1.002:1);
    o.connect(g); o.start(t0); o.stop(t0+1.05);
  });
}
function suaraKereta(){
  if(!S.sound||S.rewardSound===false) return;
  var ctx=audioCtx(); if(!ctx) return;
  var t=ctx.currentTime+0.05, jeda=0.42;
  for(var i=0;i<6;i++){ deru(ctx,t,0.10+i*0.012); t+=jeda; jeda*=0.90; }
  peluit(ctx,t+0.1);
}
function suaraBintang(){
  if(!S.sound||S.rewardSound===false) return;
  var ctx=audioCtx(); if(!ctx) return;
  var t=ctx.currentTime+0.05;
  [523.25,659.25,783.99].forEach(function(f,i){
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+i*0.16);
    g.gain.exponentialRampToValueAtTime(0.14,t+i*0.16+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.16+0.5);
    o.connect(g); g.connect(ctx.destination);
    o.start(t+i*0.16); o.stop(t+i*0.16+0.55);
  });
}

/* ===================== PASANG APLIKASI =====================
   Chrome menawarkan dialog pasang lewat beforeinstallprompt. Kejadian itu
   kita tahan, lalu dimunculkan sendiri saat tombol ditekan, supaya orang
   tidak perlu tahu letak menu titik tiga.                              */

var bipEvent=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();
  bipEvent=e;
  if(V.screen==="home") render();
});
window.addEventListener("appinstalled",function(){
  bipEvent=null;
  if(V.screen==="home") render();
});
function sudahTerpasang(){
  try{
    if(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches) return true;
    if(navigator.standalone===true) return true;
  }catch(e){}
  return false;
}
function iOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent||""); }
function bisaPasang(){ return !sudahTerpasang() && (bipEvent || iOS()); }

function pasangAplikasi(){
  if(bipEvent){
    var dp=bipEvent; bipEvent=null;
    try{
      dp.prompt();
      if(dp.userChoice&&dp.userChoice.then){
        dp.userChoice.then(function(r){
          /* kalau ditolak, tawarannya disimpan lagi untuk lain kali */
          if(!r||r.outcome!=="accepted") bipEvent=dp;
          if(V.screen==="home") render();
        });
      }
    }catch(e){ bipEvent=dp; caraPasang(); }
    return;
  }
  caraPasang();
}

  '<button class="dlgbtn" data-dlg="tutup">Nanti saja</button>'+
  '<button class="dlgbtn sunyi" data-dlg="jangan">Jangan tampilkan lagi</button>'+
  '</div></div>';
  return h;
}
function showVoiceNotice(paksa){
  if(document.getElementById("ov")) return;
  if(!paksa){
    if(noticeShown||S.ttsHideNotice||!S.sound||!TTS) return;
    if(V.screen!=="home") return;
    if(idVoice()) return;
  }
  noticeShown=true;
  var wrap=document.createElement("div");
  wrap.innerHTML=voiceNoticeHTML();
  var ov=wrap.firstChild;
  document.body.appendChild(ov);
  ov.addEventListener("click",function(e){
    var b=e.target.closest("[data-dlg]");
    if(!b){ if(e.target===ov) closeNotice(); return; }
    var a=b.getAttribute("data-dlg");
    if(a==="cek"){
      loadVoices();
      closeNotice();
      if(idVoice()){ speak("a, be, ce","ah, beh, cheh"); }
      else { noticeShown=false; setTimeout(function(){showVoiceNotice(true);},400); }
      return;
    }
    if(a==="any"){ S.voiceMode="any"; save(); closeNotice(); speak("a, be, ce","ah, beh, cheh"); return; }
    if(a==="jangan"){ S.ttsHideNotice=true; save(); closeNotice(); return; }
    closeNotice();
  });
}
function closeNotice(){
  var ov=document.getElementById("ov");
  if(ov&&ov.parentNode) ov.parentNode.removeChild(ov);
}

/* ===================== INTERAKSI ===================== */

main.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act"), list;
  unlockTTS();

  if(a==="test-tts"){
    loadVoices(); speak("a, be, ce","ah, beh, cheh");
    var stt=document.getElementById("tts-status");
    setTimeout(function(){ if(stt) stt.textContent=ttsStatus(); },900);
    return;
  }
  if(a==="go"){
    V.screen="topic"; V.topic=b.getAttribute("data-topic");
    V.tab=TOPICS[V.topic].tabs[0]; V.idx=0; V.q=null; V.streak=0;
    render(); if(V.tab==="belajar") sayCurrent(); else if(V.tab==="latihan") askQ();
    return;
  }
  if(a==="go-set"){ V.screen="set"; render(); return; }
  if(a==="go-about"){ V.screen="about"; render(); return; }
  if(a==="go-capai"){ V.screen="capai"; render(); return; }
  if(a==="salin-capai"){ salinRingkasan(); return; }
  if(a==="reset-kenal"){ S.kenal={}; save(); render(); return; }
  if(a==="cek-bahasa"){ loadVoices(); showVoiceNotice(true); return; }
  if(a==="install"){ if(sudahTerpasang()) return; pasangAplikasi(); return; }
  if(a==="tab"){
    V.tab=b.getAttribute("data-tab");
    if(V.tab==="latihan"){V.q=null;V.streak=0;}
    var mundur=false;
    if(V.tab==="tulis"&&S.writeLock){
      var bts=batasTulis();
      if(V.idx>bts){ V.idx=bts; mundur=true; }
    }
    render();
    if(V.tab==="latihan") askQ(); else if(V.tab==="belajar") sayCurrent();
    if(mundur) setStatus("Mulai dari "+kindWord()+" "+namaOf(curKey())+" dulu",false);
    return;
  }
  if(a==="stage"){ S.stage=b.getAttribute("data-v"); save(); V.q=null; render(); askQ(); return; }
  if(a==="prev"){ if(V.idx>0){V.idx--; render(); sayCurrent();} return; }
  if(a==="next"){
    list=items();
    if(V.tab==="tulis"&&S.writeLock&&!isWritten()){
      setStatus("Selesaikan dulu "+kindWord()+" "+namaOf(curKey()),false); return;
    }
    if(V.idx<list.length-1){V.idx++; render(); sayCurrent();}
    return;
  }
  if(a==="say"){ sayCurrent(); return; }
  if(a==="clear"){ clearPad(); return; }
  if(a==="contoh"){ if(anim) hentikanContoh(); else mainkanContoh(); return; }
  if(a==="say-q"){ askQ(); return; }
  if(a==="skip"){ newQuestion(); render(); askQ(); return; }
  if(a==="answer"){ answer(b); return; }
  if(a==="set"){
    var key=b.getAttribute("data-key"), val=b.getAttribute("data-val");
    if(val==="true") val=true; else if(val==="false") val=false;
    else if(/^\d+$/.test(val)) val=parseInt(val,10);
    S[key]=val; save(); applyTheme();
    if(key==="range"){V.idx=0;V.q=null;}
    render(); return;
  }
  if(a==="toggle-materi"){
    var tt=b.getAttribute("data-topic");
    if(!S.sembunyi) S.sembunyi={};
    if(S.sembunyi[tt]) delete S.sembunyi[tt]; else S.sembunyi[tt]=1;
    save(); render(); return;
  }
  if(a==="reset-stars"){ S.stars=0; save(); render(); return; }
  if(a==="reset-write"){ S.done={}; save(); render(); return; }
});
back.addEventListener("click",function(){ V.screen="home"; render(); });
gear.addEventListener("click",function(){ V.screen="set"; render(); });

function sayCurrent(){
  if(V.tab==="latihan"||kind()==="pattern") return;
  var cur=items()[V.idx], pr=sayPair(cur);
  /* Di layar Belajar huruf, nama huruf disambung dengan contoh katanya,
     "a untuk apel", supaya anak mengaitkan huruf dengan kata yang dikenal.
     Hanya bila contoh katanya memang ditampilkan di layar. */
  if(V.tab==="belajar"&&kind()==="letter"&&S.words){
    var k=WORD[String(cur).toUpperCase()][0];
    speak(pr[0]+" untuk "+k, pr[1]+" oon-took "+k);
    return;
  }
  speak(pr[0],pr[1],pr[2]);
}
/* Perintah soal diucapkan penuh, bukan cuma nama hurufnya,
   karena anak yang belum bisa membaca tidak tahu harus apa. */
function askQ(){
  if(!V.q) return;
  if(kind()==="pattern"){ speak("apa yang muncul berikutnya","what comes next"); return; }
  /* Gambar kegiatannya sudah tampil di layar, suaranya menyebut kalimat
     lengkapnya, jadi anak punya dua petunjuk yang saling menguatkan. */
  if(kind()==="kalimat"){ var kal=kalKalimat(V.q.target).toLowerCase(); speak(kal,kal); return; }

  var pr=sayPair(V.q.target), kw=kindWord(), st=stageAktif();
  var awal = st==="samakan"    ? "cari yang sama, "
           : st==="pasangkan"  ? "cari pasangannya, "
           : "mana ";
  /* Di tahap Sama dan Pasang, nama yang dicari ikut disebut supaya anak
     yang belum bisa membaca tetap tahu sedang mencari apa. Bisa dimatikan
     lewat Pengaturan bila ingin anak benar-benar mencocokkan sendiri. */
  if(st!=="tunjuk"&&S.askName==="singkat"){
    speak(awal.replace(", ",""),awal.replace(", ",""));
    return;
  }
  var vid=idVoice();
  var va=(pr[2]&&S.hijVoice!=="id")?arVoice():null;
  if(va){
    var parts=[];
    if(vid) parts.push({text:awal+kw, voice:vid, lang:vid.lang});
    else if(S.voiceMode==="any") parts.push({text:awal+kw, lang:"id-ID"});
    parts.push({text:pr[2], voice:va, lang:va.lang});
    speakSeq(parts);
    return;
  }
  speak(awal+kw+" "+pr[0], awal+kw+" "+pr[1]);
}

/* aplikasi siap: layar pembuka dilepas pelan supaya tidak terasa menyentak */
function tutupSplash(){
  var e=document.getElementById("splash");
  if(!e) return;
  e.className="pergi";
  setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },300);
}

var hash=(location.hash||"").replace("#","");
if(TOPICS[hash]){ V.screen="topic"; V.topic=hash; V.tab=TOPICS[hash].tabs[0]; V.idx=0; }

render();
tutupSplash();
setTimeout(function(){ showVoiceNotice(false); },900);

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
  });
}
})();
